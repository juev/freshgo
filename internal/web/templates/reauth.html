{{define "content"}}
<h1>{{.Heading}}</h1>
<p>{{.T "reauth.intro"}}</p>
{{template "problem" .Data.Error}}
{{if not .Data.PasswordOff}}<form method="post" action="{{.URL "/reauth"}}" class="form">
<input type="hidden" name="next" value="{{.Data.Next}}">
<p>
<label for="password">{{.T "login.password"}}</label>
<input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
</p>
<p><button type="submit">{{.T "reauth.submit"}}</button></p>
</form>
{{end}}
{{if .Data.Passkeys}}
<p id="passkey-signin" hidden data-begin="{{.URL "/passkeys/reauth/begin"}}" data-finish="{{.URL "/passkeys/reauth/finish"}}" data-next="{{.Data.Next}}"><button type="button">{{.T "reauth.passkey"}}</button></p>
<p class="alert" id="passkey-failed" role="alert" hidden>{{.T "login.passkey.failed"}}</p>
{{end}}
{{if .Data.Provider}}<p><a href="{{.Data.ProviderURL}}">{{.T "login.oidc" .Data.Provider}}</a></p>{{end}}
{{end}}
